name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so Pages is never left
# serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Strict: fail if pnpm-lock.yaml disagrees with package.json rather than
      # quietly re-resolving, so a deploy always installs the exact tree that
      # was committed. A failure here means the lockfile needs committing.
      - run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          # Derived from the repo name, so renaming the repo or forking it keeps
          # the asset paths correct with no edit here.
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter client build

      # `enablement` turns Pages on via the API when the repo has not had it
      # switched on by hand. Without it this step fails with a bare "Not Found"
      # on a repo whose Pages settings were never touched.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
